<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', sans-serif" role="img" aria-label="Hybrid RAG pipeline architecture diagram">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a66c2"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="460" fill="#f6f8fc" rx="16"/>
  <rect x="0" y="0" width="1000" height="6" fill="url(#hdr)"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Hybrid Retrieval-Augmented Generation Pipeline</text>

  <!-- Ingestion -->
  <rect x="30" y="70" width="150" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="105" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Document</text>
  <text x="105" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Ingestion</text>
  <text x="105" y="130" text-anchor="middle" font-size="10.5" fill="#64748b">chunk + overlap</text>

  <line x1="180" y1="105" x2="230" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Split into two retrieval paths -->
  <rect x="230" y="30" width="160" height="60" rx="10" fill="#e8f1fb" stroke="#0a66c2" stroke-width="1.5"/>
  <text x="310" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#0a66c2">Dense Search</text>
  <text x="310" y="72" text-anchor="middle" font-size="10.5" fill="#0a66c2">BGE embeddings + ChromaDB</text>

  <rect x="230" y="130" width="160" height="60" rx="10" fill="#e6fbfa" stroke="#0891b2" stroke-width="1.5"/>
  <text x="310" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#0891b2">BM25 Search</text>
  <text x="310" y="172" text-anchor="middle" font-size="10.5" fill="#0891b2">exact / lexical match</text>

  <line x1="180" y1="90" x2="230" y2="60" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="120" x2="230" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fusion -->
  <line x1="390" y1="60" x2="440" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="160" x2="440" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="75" width="150" height="60" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="515" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Reciprocal Rank</text>
  <text x="515" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Fusion</text>

  <line x1="590" y1="105" x2="640" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reranking -->
  <rect x="640" y="75" width="160" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="720" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Cross-Encoder</text>
  <text x="720" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Reranking</text>

  <line x1="800" y1="105" x2="850" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM synthesis -->
  <rect x="850" y="75" width="120" height="60" rx="10" fill="#0a66c2"/>
  <text x="910" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">LLM</text>
  <text x="910" y="117" text-anchor="middle" font-size="11" fill="#ffffff">Synthesis + Citations</text>

  <!-- HyDE query expansion (vague query path) -->
  <rect x="440" y="230" width="220" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="550" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">HyDE Query Expansion</text>
  <text x="550" y="272" text-anchor="middle" font-size="10.5" fill="#9a3412">for vague / underspecified queries</text>

  <rect x="30" y="230" width="180" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="120" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">User Query</text>
  <text x="120" y="272" text-anchor="middle" font-size="10.5" fill="#64748b">natural-language question</text>

  <line x1="210" y1="260" x2="440" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,4"/>
  <text x="325" y="245" text-anchor="middle" font-size="10" fill="#64748b">if vague</text>

  <line x1="660" y1="260" x2="720" y2="260" stroke="#64748b" stroke-width="1.5"/>
  <line x1="720" y1="260" x2="720" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="120" y1="230" x2="120" y2="185" stroke="#64748b" stroke-width="1.5"/>
  <line x1="120" y1="185" x2="310" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="185" x2="310" y2="185" stroke="#64748b" stroke-width="0" />

  <!-- Access control / guardrail -->
  <rect x="850" y="230" width="120" height="60" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="910" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Access Control</text>
  <text x="910" y="270" text-anchor="middle" font-size="10" fill="#991b1b">enforced at retrieval</text>
  <line x1="910" y1="230" x2="910" y2="135" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Failure note -->
  <text x="500" y="400" text-anchor="middle" font-size="12.5" fill="#334155" font-style="italic">
    Why hybrid: dense-only retrieval quietly missed exact-term queries (names, part numbers). BM25 + dense fusion fixed it.
  </text>
  <text x="500" y="425" text-anchor="middle" font-size="11" fill="#94a3b8">Komal Shahid — DSC680 Capstone Research Pipeline</text>
</svg>
